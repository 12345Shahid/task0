version: '3.8'

services:
  aura-web:
    build: .
    container_name: aurabrowser-cloud
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - PROXY_HOST=thehub.proxy-cheap.com:8080
      - PROXY_USER=Ltj8SfJpTEukyVn
      - PROXY_BASE_PASS=0Pa7rRMzcehfeLR
      - MAX_SESSIONS=15
      - IDLE_TIMEOUT_MINUTES=30
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
